name: SHChristmasPresents
version: '${project.version}'
main: org.Cry_Legende.sHChristmasPresents.SHChristmasPresents
api-version: '1.20'
author: Cry_Legende
description: Un plugin d'évènement de Noël avec des cadeaux BlockDisplay et des boules de neige.

commands:
  shchristmaspresents:
    description: Commande principale du plugin
    aliases: [xmas, scp]
    usage: /shchristmaspresents <subcommand>
    permission: shchristmaspresents.admin

permissions:
  shchristmaspresents.admin:
    description: Permet d'utiliser les commandes d'admin
    default: op

# Textes de SHChristmasPresents.
# Codes couleur avec & (et &#RRGGBB). Les messages portent leur préfixe ; un texte vide ("") n'est pas envoyé.
# Exceptions MiniMessage : cooldown_message, snowball_received, boule.*, clicker.* (%time%, %clicks%, %required%,
# %level%, %next_reward%). Les textes des sous-commandes 1.1 (usage … info-line) sont précédés de la clé prefix.

# ---------------------------------------------------------------- textes 1.1

prefix: "&7&l« &c&lSH &8&l» &7"
cooldown_message: "<red>Doucement, il y aura des cadeaux pour tout le monde !</red>"
snowball_received: "<white><bold>« <red>SH</red> » </bold>Tu as reçu une <gradient:#ff0000:#ffffff><bold>boule de neige magique</bold></gradient> !</white>"
usage: "Sous-commandes possibles &c/shchristmaspresents <%subcommands%>"
# Commande joueur tapée hors de l'Avent, du monde de Noël et des emplettes : même texte qu'une commande inconnue.
commande-fermee: "&7&l« &f&lSH &8&l» &fCommande inconnue, essayez autre chose"
player-only: "Cette commande est &créservée aux joueurs&7."
player-not-found: "Le joueur &c%player% &7n'est pas en ligne."
give-usage: "Tape &c/shchristmaspresents give <joueur> [nombre]"
give-done: "&a%amount% &7boule(s) de neige magique(s) donnée(s) à &a%player%&7."
region-set: "Position &a%corner% &7de la zone des cadeaux définie."
clicker-created: "Bonhomme de neige clicker &acréé&7."
clicker-removed: "Bonhomme de neige clicker &asupprimé&7."
clicker-none-nearby: "Aucun bonhomme de neige clicker à moins de &c3 blocs&7."
clickers-header: "&e%count% &7bonhomme(s) de neige clicker"
clickers-line: "&8 - &7%world% %x%, %y%, %z%"
reload-success: "Configuration &arechargée&7, avec &e%models% &7modèles de cadeaux, les textes et les réglages."
reload-error: "Rechargement &crefusé&7, %file% est invalide (%error%). La configuration précédente est gardée."
info-usage: "Tape &c/shchristmaspresents info <joueur>"
info-unknown: "Aucune donnée de clicker pour &c%player%&7."
info-line: "&e%player% &7a &e%clicks% &7clics, niveau &e%level%&7, prochain niveau à &e%required% &7clics."

erreur: "&7&l« &c&lSH &8&l» &7Un problème est survenu, rien n'a été retiré. Réessaie dans un instant."

# ---------------------------------------------------------------- cadeaux du monde de Noël et clicker (MiniMessage)

boule:
  nom: "<gradient:#ff0000:#ffffff><bold>❄ Boule de neige magique ❄</bold></gradient>"
  lore:
    - "<dark_gray>ᴄᴏʟʟᴇᴄᴛɪᴏɴ ɴᴏᴇʟ 2026 ☃</dark_gray>"
    - ""
    - "<gray>Lance-la sur un cadeau du</gray>"
    - "<gray>monde de Noël pour l'ouvrir.</gray>"

clicker:
  barre: "<white>Niveau <yellow>%level%</yellow> <dark_gray>•</dark_gray> <aqua>%clicks%</aqua><gray>/%required% clics</gray> <dark_gray>•</dark_gray> <gray>prochain niveau</gray> <white>%next_reward% boules</white></white>"
  sous-titre: ""
  niveau: "<bold><gray>«</gray> <green>SH</green> <dark_gray>»</dark_gray></bold> <gray>Bravo, tu passes <green>niveau %level%</green> et tu gagnes des <white>boules de neige magiques</white> !</gray>"
  anti-afk: "<gray>Bouge un peu pour continuer à cliquer</gray>"

# Monde de Noël. Titre court à l'ouverture d'un cadeau de cette rareté (village.raretes dans config.yml), absent = pas
# de titre. a-la-main : clic sur un cadeau sans boule de neige magique en main (une fois toutes les 4 secondes).
village:
  # Téléport refusé vers le monde de Noël fermé (village.fermeture dans config.yml).
  ferme: "&7&l« &e&lSH &8&l» &7Le monde de Noël ouvre le &e1er décembre&7."
  a-la-main: "&7&l« &e&lSH &8&l» &7Ce cadeau s'ouvre avec une &eboule de neige magique&7. Clique un &ebonhomme de neige &7pour en gagner, puis lance-la sur le cadeau."
  titres:
    dore: "&6&lCadeau doré !"
  sous-titres:
    dore: "&e+25 ❄"

# ---------------------------------------------------------------- Flocons

flocons:
  # Ligne de chat d'un gain donné par la commande « shchristmaspresents flocons » (récompense de quête, d'évènement,
  # de boss…), au format des listes de récompenses. {montant} = Flocons vraiment versés ; rien quand rien n'est versé
  # (hors période de gains, plafond). Vide = rien.
  ligne-commande: "&8 • &b+{montant} Flocons ❄ &7(/flocons)"
  # Barre d'action d'un gain, par source ({montant} versé, {source} = nom ci-dessous). Vide = rien.
  gains:
    defaut: "&b+{montant} ❄ &7{source}"
    porte: ""
    bienvenue: ""
    cadeau-recu: ""
  sources:
    porte: "Case de l'Avent"
    defi: "Défi du Lutin"
    village: "Cadeau"
    ile: "Petit cadeau"
    temps: "Temps de jeu"
    vote: "Vote"
    maison: "Maison en pain d'épice"
    parkour: "Parkour de Noël"
    soiree: "Mini-jeu de Noël"
    sapin-palier: "Palier du Grand Sapin"
    cadeau-recu: "Cadeau reçu"
    drop: "Cadeau du ciel"
    bienvenue: "Bienvenue"
    retour: "Retour"
    admin: "Bonus"
    cargaison: "Cargaison"
  # /flocons
  commande:
    entete: "&7&l« &e&lSH &8&l» &7Tu as &b{solde} ❄&7, dont &b+{jour} ❄ &7gagnés aujourd'hui."
    hors-phase: "&7&l« &e&lSH &8&l» &7Les Flocons se gagnent du &e{avent} &7au &e{fin-gains}&7."
    ligne: "&8 • &7{source} &b+{verse} ❄{reste}"
    reste: " &8(&7encore &f{reste} &7plein tarif&8)"
    plafond-reduit: " &8(&7plafond atteint, gains réduits&8)"
    plafond-atteint: " &8(&7plafond du jour atteint&8)"
    multiplicateur: "&7&l« &e&lSH &8&l» &7Tes gains sont multipliés par &e{facteur} &7en ce moment."


    "16": "&b+{flocons} ❄ &7et &f2 clés ordinaires"
    "18": "&b+{flocons} ❄ &7et &f1 LuckyBlock"
    "20": "&b+{flocons} ❄ &7et &f1 décoration Noël 2026"

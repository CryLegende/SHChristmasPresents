    titre: "&8Calendrier de l'Avent"
    info:
      nom: "&c&lCalendrier de l'Avent"
      description:
        - "&a{ouvertes}&7/{total} portes ouvertes"
        - "&7Prochain palier &f{palier}"
        - ""
        - "&7Une porte par jour, et 3 jours"
        - "&7pour rattraper une porte manquée."
    porte:
      a-venir:
        nom: "&7Porte n°{porte}"
        lore:
          - "&8S'ouvre le {date}"
      ouvrable:
        nom: "&a&lPorte n°{porte}"
        lore:
          - "&7Elle t'attend aujourd'hui."
          - ""
          - "&a» Clic pour l'ouvrir"
      rattrapable:
        nom: "&ePorte n°{porte}"
        lore:
          - "&7À rattraper jusqu'au {limite}."
          - ""
          - "&e» Clic pour l'ouvrir"

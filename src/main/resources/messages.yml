    "4": "&b+{flocons} ❄ &7et &f2 clés ordinaires"
    "6": "&b+{flocons} ❄ &7et &f1 LuckyBlock"
    "9": "&b+{flocons} ❄ &7et &f1 h de fly"
    "11": "&b+{flocons} ❄ &7et &f1 750 EXP"
    "13": "&b+{flocons} ❄ &7et &f1 décoration Noël 2026"
    "16": "&b+{flocons} ❄ &7et &f2 clés ordinaires"
    "18": "&b+{flocons} ❄ &7et &f1 LuckyBlock"
    "20": "&b+{flocons} ❄ &7et &f1 décoration Noël 2026"
    "23": "&b+{flocons} ❄ &7et &f300 tokens"
    "25": "&b+{flocons} ❄&7, &f2 clés de Noël &7et &f150 tokens &7!"
  paliers-contenu:
    "7": "&f1 clé de Noël &7offerte."
    "14": "&f1 clé de Noël &7et &f1 décoration Noël 2026 &7offertes."
    "21": "&f2 clés de Noël &7offertes."

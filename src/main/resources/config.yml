# SHChristmasPresents
#
# Événement de Noël dans le monde de region.world : des cadeaux apparaissent dans la zone region et s'ouvrent en leur
# lançant une boule de neige magique (rewards : commandes de chaque rareté). Les bonhommes de neige clicker (clicker)
# donnent des boules de neige au fil des clics ; clics et niveau de chaque joueur sont dans playerdata.yml.
#
# Commandes (/shchristmaspresents, alias /xmas et /scp) :
#   give [joueur] [nombre]   Donne des boules de neige magiques (sans joueur : à soi).
#   setregion <1|2>          Définit un coin de la zone des cadeaux à votre position.
#   createclicker            Place un bonhomme de neige clicker à votre position.
#   removeclicker            Retire le bonhomme de neige clicker le plus proche (3 blocs).
#   listclickers             Liste les bonhommes de neige clicker.
#   reload                   Relit config.yml, messages.yml et models/, retire les cadeaux actifs, relance
#                            l'apparition des cadeaux avec le nouveau settings.respawn_time_ticks. Si config.yml ou
#                            messages.yml est invalide, rien n'est remplacé et le message donne le fichier et
#                            l'erreur. playerdata.yml et snowmen.yml ne sont jamais relus.
#   info <joueur>            Clics, niveau et clics du prochain niveau d'un joueur.
#   Sans argument, la commande affiche les sous-commandes que vous pouvez utiliser. give, listclickers, reload et
#   info marchent depuis la console ; les autres demandent un joueur.
#
# Permissions (op par défaut) :
#   shchristmaspresents.admin                  Toutes les sous-commandes.
#   shchristmaspresents.admin.give, .setregion, .createclicker, .removeclicker, .listclickers, .reload, .info
#                                              Une par sous-commande.
#
# Les textes de la commande, du cooldown et de la réception d'une boule sont dans messages.yml.
#
# Placeholders (PlaceholderAPI) :
#   %shchristmaspresents_clicks%   Clics du joueur sur les bonhommes de neige.
#   %shchristmaspresents_level%    Niveau du joueur.
#
# Plusieurs serveurs de jeu : cadeaux et bonhommes de neige sont dans le monde Christmas, hébergé par un seul Opale.
# Ne poser le plugin que sur celui-là : playerdata.yml (clics et niveau) n'a ainsi qu'un seul serveur qui l'écrit.
# Rien à synchroniser, SHNetwork n'est pas utilisé.

snowball:
  name: <gradient:#ff0000:#ffffff><bold>❄ Boule de neige magique ❄</bold></gradient>
  lore:
  - <dark_gray>ᴄᴏʟʟᴇᴄᴛɪᴏɴ ɴᴏᴇʟ 2025 ☃</dark_gray>
  - <b></b>
  - <gray>Lancez la sur un cadeau pour</gray>
  - <gray>ouvrir celui ci !</gray>

debug: false

settings:
  respawn_time_ticks: 20
  max_concurrent_gifts: 30
  cooldown_seconds: 1
  vertical_offset: 0.0

# CONFIGURATION DES RÉCOMPENSES ET MODÈLES
rewards:
  # Rareté "Commun"
  common:
    chance: 70
    # Liste des modèles (sans extension) qui peuvent apparaître pour cette rareté
    models:
    - cadeau_rouge
    commands:
    # - rc cadeau_commun %player%
    - shnetworklevel exp give %player% 1
    - playerpoints:points give %player% 2
    - sm %player% &b+1 exp de network%shnetworklevel_bonus_texte% &7(/network)
  
  # Rareté "Rare"
  rare:
    chance: 30
    models:
    - cadeau_bleu
    commands:
    # - rc cadeau_rare %player%
    - shnetworklevel exp give %player% 2
    - playerpoints:points give %player% 4
    - sm %player% &b+2 exp de network%shnetworklevel_bonus_texte% &7(/network)

# --- SECTION CLICKER ---
clicker:
  max_cps: 6
  click_sound: BLOCK_SNOW_BREAK
  
  # Action bar affiche progression actuelle / requis pour niveau suivant
  action_bar: '<gradient:#ff0000:#ffffff>Lvl %level% | Clics: %clicks%/%required%</gradient>
    | <gradient:#ffffff:#ff0000>Prochain gain: %next_reward% ❄</gradient>'
  
  subtitle_on_click: ''
  
  levelup_message: <bold><green>FÉLICITATIONS !</green></bold> <gray>Vous passez niveau
    <yellow>%level%</yellow> !</gray>
  
  # -- ALGORITHME MATHÉMATIQUE (INFINI) --
  algorithm:
    # Nombre de clics pour le niveau 1
    base_clicks: 70
    
    # Difficulté : Multiplie le coût précédent. 
    # 2.5 signifie : Niveau 1 = 50. Niveau 2 = 50 * 2.5 = 125. Niveau 3 = 125 * 2.5 ≈ 312.
    multiplier: 1.22
    
    # Récompenses (Boules de neige)
    base_reward: 1
    # Combien de boules EN PLUS on gagne à chaque nouveau niveau
    reward_increase_per_level: 1
  
  # -- ANTI AUTO CLICK AFK --
  anti_afk:
    # Au bout de combien de clics SANS bouger on bloque le joueur ?
    max_static_clicks: 75
    
    # De quelle distance (en blocs) le joueur doit bouger pour reset le compteur ?
    min_move_distance: 0.4
    
    # Message affiché en gros (subtitle) quand bloqué
    warning_message: <red><bold>ANTI-AFK</bold></red> <gray>Bougez pour continuer
      à cliquer</gray>

region:
  world: Christmas
  # /shchristmaspresents setregion [1-2]
  x1: 28.30000001192093
  y1: 123.74355714909177
  z1: 35.74524212543371
  x2: -29.183782885779728
  y2: 118.2762946894557
  z2: -46.852533112979096
